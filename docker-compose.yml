# Local production-like stack: the app (API + built frontend on one port) and MongoDB 7.
#   cp .env.example .env        # then put two different random secrets in it
#   docker compose up -d --build
#   open http://localhost:5000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${APP_PORT:-5000}:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/repairhub}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CURRENCY: ${CURRENCY:-NPR}
    # Indexes (incl. 2dsphere) are synced as an explicit deploy step before the server starts.
    command: ['sh', '-c', 'node src/scripts/syncIndexes.js && node src/server.js']
    volumes:
      - uploads:/app/backend/uploads

volumes:
  mongo-data:
  uploads:
